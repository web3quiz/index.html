<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Фиолетовый Магазин</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="header-container">
            <h1><i class="fas fa-store"></i> Фиолетовый Магазин</h1>
            <div class="cart-icon" onclick="showCart()">
                <i class="fas fa-shopping-cart"></i>
                <span id="cart-count">0</span>
            </div>
        </div>
    </header>

    <main>
        <div id="products-container" class="products-container">
            <!-- Товары будут загружены через JS -->
        </div>

        <div id="cart-container" class="cart-container hidden">
            <div class="cart-header">
                <h2><i class="fas fa-shopping-basket"></i> Ваша корзина</h2>
                <button onclick="hideCart()" class="close-btn">&times;</button>
            </div>
            <div id="cart-items" class="cart-items">
                <!-- Товары в корзине -->
            </div>
            <div class="cart-footer">
                <div class="total">Итого: <span id="total-price">0 руб.</span></div>
                <button onclick="checkout()" class="checkout-btn">
                    <i class="fas fa-credit-card"></i> Оформить заказ
                </button>
            </div>
        </div>

        <div id="checkout-modal" class="modal hidden">
            <div class="modal-content">
                <span class="close-btn" onclick="closeModal()">&times;</span>
                <h2><i class="fas fa-truck"></i> Оформление заказа</h2>
                <form id="checkout-form">
                    <div class="form-group">
                        <label for="name"><i class="fas fa-user"></i> Ваше имя:</label>
                        <input type="text" id="name" required placeholder="Иван Иванов">
                    </div>
                    <div class="form-group">
                        <label for="phone"><i class="fas fa-phone"></i> Телефон:</label>
                        <input type="tel" id="phone" required placeholder="+7 (999) 123-45-67">
                    </div>
                    <div class="form-group">
                        <label for="address"><i class="fas fa-map-marker-alt"></i> Адрес доставки:</label>
                        <textarea id="address" required placeholder="Город, улица, дом, квартира"></textarea>
                    </div>
                    <div class="form-group">
                        <label for="comments"><i class="fas fa-comment"></i> Комментарии:</label>
                        <textarea id="comments" placeholder="Дополнительные пожелания"></textarea>
                    </div>
                    <button type="submit" class="submit-btn">
                        <i class="fas fa-paper-plane"></i> Отправить заказ
                    </button>
                </form>
            </div>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
